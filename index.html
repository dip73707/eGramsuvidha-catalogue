function openWhatsApp(text){

 );

function escapeVCard(value){
 return String(value)
  .replace(/\\/g,"\\\\")
  .replace(/\n/g,"\\n")
  .replace(/,/g,"\\,")
  .replace(/;/g,"\\;");
}

function downloadVCard(){
 const data=[
  "BEGIN:VCARD",
  "VERSION:3.0",
  "FN:"+escapeVCard(COMPANY.name),
  "ORG:"+escapeVCard(COMPANY.name),
  "TITLE:eGramsuvidha",
  "TEL;TYPE=WORK:+91"+COMPANY.companyMobile,
  "TEL;TYPE=CELL:+91"+COMPANY.supportMobile,
  "EMAIL:"+COMPANY.email,
  "URL:"+COMPANY.companyWebsite,
  "NOTE:"+escapeVCard("Product: "+COMPANY.productWebsite),
  "END:VCARD"
 ].join("\r\n");

 const blob=new Blob([data],{
  type:"text/vcard;charset=utf-8"
 });

 const url=URL.createObjectURL(blob);
 const link=document.createElement("a");
 link.href=url;
 link.download="SP-DigiNova-Tech.vcf";
 document.body.appendChild(link);
 link.click();
 link.remove();

 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function localDate(){
 const d=new Date();
 const year=d.getFullYear();
 const month=String(d.getMonth()+1).padStart(2,"0");
 const day=String(d.getDate()).padStart(2,"0");
 return year+"-"+month+"-"+day;
}
